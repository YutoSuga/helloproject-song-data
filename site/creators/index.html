<div id="ranking-content" hidden>
<nav id="creator-views" class="view-tabs" aria-label="作家ページの表示" role="tablist">
      <button id="view-search-tab" class="view-tab" data-view="search" type="button" role="tab" aria-controls="creator-search-panel" aria-selected="true" tabindex="0">作家検索</button>

    </nav>
    <section id="creator-search-panel" role="tabpanel" aria-labelledby="view-search-tab">
      <label for="creator-search" class="visually-hidden">作家名で検索</label>
      <input id="creator-search" class="creator-search-input" type="search" placeholder="作家名で検索" autocomplete="off">
      <p id="creator-search-count" role="status"></p>
      <p id="creator-search-empty" class="summary" role="status" hidden>該当する作家がありません。</p>
      <ul id="creator-search-results" class="creator-results"></ul>
    </section>
    <div id="ranking-panel" role="tabpanel" aria-labelledby="view-ranking-tab" hidden>
    <nav class="category-tabs" aria-label="ランキングカテゴリ" id="category-tabs" role="tablist"></nav>
    <section id="category-panel" role="tabpanel" aria-labelledby="category-all">
      <div class="section-heading">
        <div><h2 id="ranking-heading">すべてランキング</h2></div>
        <p id="summary" class="summary" aria-live="polite"></p>
      </div>
      <div id="ranking" class="ranking" aria-live="polite"></div>
    </section>
    </div>
    <section id="pair-panel" class="pair-analysis" role="tabpanel" aria-labelledby="view-pairs-tab" hidden>
      <div class="section-heading">
        <div><h2 id="pair-heading">作詞 × 作曲</h2></div>
      </div>
      <div class="pair-controls">
        <div class="creator-combobox">
          <input id="pair-creator" aria-label="作家名またはIDで検索" type="text" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="pair-creator-options" autocomplete="off" placeholder="作家名またはIDで検索">
          <span id="combo-live" class="visually-hidden" role="status" aria-live="polite"></span>
          <ul id="pair-creator-options" class="creator-options" role="listbox" aria-label="作家候補" hidden></ul>
        </div>
        <div class="pair-actions">
        <fieldset class="pair-roles">
          <legend class="visually-hidden">担当役割</legend>
          <label><input id="pair-lyrics" type="checkbox" disabled> 作詞</label>
          <label><input id="pair-composition" type="checkbox" disabled> 作曲</label>
        </fieldset>
        <button id="pair-clear" type="button">クリア</button>
        </div>
      </div>
      <p id="pair-condition" class="summary" aria-live="polite"></p>
      <p id="pair-summary" class="summary" aria-live="polite"></p>
      <div id="pair-ranking" class="ranking" aria-live="polite"></div>
    </section>
</div>
