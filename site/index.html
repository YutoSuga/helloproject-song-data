<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juice=Juice 作家ランキング | Hello! Project Song Database</title>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Hello! Project Song Database</p>
    <h1><span id="artist-name">Juice=Juice</span> <span>作家ランキング</span></h1>
    <p>曲数は具体的な音源数ではなく、重複を除いた作品（work）数です。</p>
  </header>
  <main>
    <nav class="view-tabs" aria-label="表示する分析" role="tablist">
      <button id="view-ranking-tab" class="view-tab" type="button" role="tab" aria-controls="ranking-panel" aria-selected="true" tabindex="0">曲数ランキング</button>
      <button id="view-pairs-tab" class="view-tab" type="button" role="tab" aria-controls="pair-panel" aria-selected="false" tabindex="-1">組み合わせ分析</button>
    </nav>
    <div id="ranking-panel" role="tabpanel" aria-labelledby="view-ranking-tab">
    <nav class="category-tabs" aria-label="ランキングカテゴリ" id="category-tabs" role="tablist"></nav>
    <section aria-labelledby="ranking-heading">
      <div class="section-heading">
        <div><p class="eyebrow">全順位</p><h2 id="ranking-heading">読み込み中</h2></div>
        <p id="summary" class="summary" aria-live="polite"></p>
      </div>
      <div id="ranking" class="ranking" aria-live="polite"></div>
    </section>
    </div>
    <section id="pair-panel" class="pair-analysis" role="tabpanel" aria-labelledby="view-pairs-tab" hidden>
      <div class="section-heading">
        <div><p class="eyebrow">組み合わせ分析</p><h2 id="pair-heading">作詞 × 作曲</h2></div>
        <p id="pair-summary" class="summary"></p>
      </div>
      <div class="pair-controls">
        <label for="pair-direction">Creatorの担当</label>
        <select id="pair-direction">
          <option value="all">全組み合わせ</option>
          <option value="lyricist">作詞者として選ぶ</option>
          <option value="composer">作曲者として選ぶ</option>
        </select>
        <label for="pair-creator">Creator</label>
        <div class="creator-combobox">
          <input id="pair-creator" type="text" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="pair-creator-options" autocomplete="off" placeholder="担当を選択してください" disabled>
          <ul id="pair-creator-options" class="creator-options" role="listbox" hidden></ul>
        </div>
      </div>
      <p id="pair-self-count" class="summary" aria-live="polite" hidden></p>
      <div id="pair-ranking" class="ranking" aria-live="polite"></div>
    </section>
    <aside id="creator-detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-heading" hidden>
      <button id="close-detail" class="close" type="button" aria-label="作家詳細を閉じる">×</button>
      <p class="eyebrow">集計根拠</p>
      <p id="pair-detail-role" class="pair-role" hidden>作詞 × 作曲</p>
      <h2 id="detail-heading"></h2>
      <p id="detail-summary"></p>
      <ol id="work-list" class="work-list"></ol>
    </aside>
  </main>
  <footer>Canonical IDsを保持した静的派生データです。</footer>
</body>
</html>
