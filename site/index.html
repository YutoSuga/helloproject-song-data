<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juice=Juice 作家ランキング | Hello! Project Song Database</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Hello! Project Song Database</p>
    <h1><span id="artist-name">Juice=Juice</span> <span>作家ランキング</span></h1>
    <p>曲数は具体的な音源数ではなく、重複を除いた作品（work）数です。</p>
  </header>
  <main>
    <nav class="category-tabs" aria-label="ランキングカテゴリ" id="category-tabs" role="tablist"></nav>
    <section aria-labelledby="ranking-heading">
      <div class="section-heading">
        <div><p class="eyebrow">全順位</p><h2 id="ranking-heading">読み込み中</h2></div>
        <p id="summary" class="summary" aria-live="polite"></p>
      </div>
      <div id="ranking" class="ranking" aria-live="polite"></div>
    </section>
    <aside id="creator-detail" class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-heading" hidden>
      <button id="close-detail" class="close" type="button" aria-label="作家詳細を閉じる">×</button>
      <p class="eyebrow">集計根拠</p>
      <h2 id="detail-heading"></h2>
      <p id="detail-summary"></p>
      <ol id="work-list" class="work-list"></ol>
    </aside>
  </main>
  <footer>Canonical IDsを保持した静的派生データです。</footer>
</body>
</html>
