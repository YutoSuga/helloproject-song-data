<div class="content">
<a class="sp-brand" data-home href="/">ハロプロ作家研究所<small>Hello! Project Creator Lab</small></a>
<main id="main" tabindex="-1">
<h1>分析</h1>
<label class="field">アーティスト<select id="artist-select"><option disabled>モーニング娘。’26（Coming Soon）</option><option disabled>アンジュルム（Coming Soon）</option><option value="G00001" selected>Juice=Juice</option><option disabled>つばきファクトリー（Coming Soon）</option><option disabled>BEYOOOOONDS（Coming Soon）</option><option disabled>OCHA NORMA（Coming Soon）</option><option disabled>ロージークロニクル（Coming Soon）</option><option disabled>ハロプロ研修生（Coming Soon）</option></select></label>
<p id="artist-notice" role="status" hidden></p>
<div class="lab-tabs" role="tablist" aria-label="分析方法"><button type="button" role="tab" data-value="pairs" id="tab-pairs" aria-controls="tab-panel" aria-selected="true" tabindex="0">組み合わせランキング</button>
<button type="button" role="tab" data-value="creator" id="tab-creator" aria-controls="tab-panel" aria-selected="false" tabindex="-1">作家指定分析</button></div>
<section id="tab-panel" role="tabpanel" aria-labelledby="tab-pairs">
  <div class="lab-controls" id="pair-mode" role="group" aria-label="組み合わせの集計方式">
    <button data-mode="all" aria-pressed="true">すべて</button>
    <button data-mode="lyrics_composition" aria-pressed="false">作詞 × 作曲</button>
  </div>
  <h2 id="analysis-heading">全担当区分の組み合わせ</h2>
  <div class="creator-combobox">
    <label class="field"><span id="picker-label">対象作家（任意）</span>
      <input type="text" id="pair-creator" role="combobox" aria-label="作家名またはIDで検索" aria-autocomplete="list" aria-controls="pair-creator-options" aria-expanded="false" autocomplete="off" disabled>
    </label>
    <ul role="listbox" aria-labelledby="picker-label" id="pair-creator-options" hidden></ul>
    <span id="combo-live" class="visually-hidden" role="status"></span>
  </div>
  <div class="lab-controls" id="pair-filters">
    <label><input id="pair-lyrics" type="checkbox" disabled> 作詞</label>
    <label><input id="pair-composition" type="checkbox" disabled> 作曲</label>
    <label><input id="include-self" type="checkbox"> 同一作家の組み合わせを含む</label>
    <button type="button" id="pair-clear">クリア</button>
  </div>
  <p id="collaboration-note" hidden>同じ音源にクレジットされた別の作家を、作品単位で集計します。共通クレジットに基づく指標で、実際の制作過程を示すものではありません。</p>
  <p id="data-status" role="status">データを読み込んでいます。</p>
  <p id="analysis-notice" role="status" hidden></p>
  <p id="pair-condition"></p>
  <p id="summary" role="status"></p>
  <ol id="results" class="lab-list"></ol>
</section>

</main>
