name: Deploy ranking site to GitHub Pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  workflow_dispatch:

# Label changes replace an in-flight PR run. Merged runs use a separate group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'closed' && 'main' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  gate_compatibility:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    name: Gate publication (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # A merged PR must build the latest main, not its former PR merge ref.
          ref: ${{ github.event.action == 'closed' && 'main' || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Gate publication, candidate integration and crash compatibility
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:light') }}
        run: node --test --test-concurrency=1 test/fn004-gate-publication.test.js test/fn004-gate-publication-crash.test.js test/fn004-gate-candidate-integration.test.js
  build:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Initialized FN-004 readers audit complete origin/main history.
          fetch-depth: 0
          # A merged PR must build the latest main, not its former PR merge ref.
          ref: ${{ github.event.action == 'closed' && 'main' || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Run tests
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:light') }}
        run: npm test
      - name: Validate rankings
        run: npm run rankings:validate
      - name: Build static site from canonical CSV
        run: npm run site:build
      - name: Check generated ranking data is committed
        run: git diff --exit-code -- site/data/rankings
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    needs: [build, gate_compatibility]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
