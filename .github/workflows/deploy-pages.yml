name: Deploy ranking site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Replace PR runs after label changes; keep main validations independent by SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci_mode:
    name: Select CI mode
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve PR label with full CI fallback
        id: select
        uses: actions/github-script@v8
        with:
          script: |
            const selectMode = require('./.github/scripts/ci-policy.cjs');
            await selectMode({ github, context, core });

  gate_compatibility:
    needs: ci_mode
    name: Gate publication (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.ci_mode.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Gate publication, candidate integration and crash compatibility
        if: needs.ci_mode.outputs.mode != 'light'
        run: node --test --test-concurrency=1 test/fn004-gate-publication.test.js test/fn004-gate-publication-crash.test.js test/fn004-gate-candidate-integration.test.js
  build:
    needs: ci_mode
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Initialized FN-004 readers audit complete origin/main history.
          fetch-depth: 0
          ref: ${{ needs.ci_mode.outputs.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Run tests
        if: needs.ci_mode.outputs.mode != 'light'
        run: npm test
      - name: Validate rankings
        run: npm run rankings:validate
      - name: Build static site from canonical CSV
        run: npm run site:build
      - name: Check generated ranking data is committed
        run: git diff --exit-code -- site/data/rankings
      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [ci_mode, build, gate_compatibility]
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      # Hold the deployment concurrency lock while checking freshness and deploying.
      # Never cancel an active deployment: cancellation can leave server-side work running.
      - name: Check verified SHA is still latest main
        id: freshness
        uses: actions/github-script@v8
        env:
          VERIFIED_SHA: ${{ needs.ci_mode.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const current = data.object.sha === process.env.VERIFIED_SHA;
            core.setOutput('current', String(current));
            if (!current) core.notice('Newer main exists; skip publishing this older artifact.');
      - name: Deploy GitHub Pages artifact
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
