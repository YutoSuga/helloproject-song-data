name: Deploy ranking site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Full ancestor SHA (normally before from the main push being revalidated)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    outputs:
      sha: ${{ github.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Fetch base objects for explicit PR/push/manual ID boundaries.
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false
      - name: Resolve ID comparison boundary
        id: boundary
        uses: actions/github-script@v8
        with:
          script: |
            const select = require('./.github/scripts/id-ci-base.cjs');
            const result = select({eventName: context.eventName, payload: context.payload, sha: context.sha, ref: context.ref});
            core.info(JSON.stringify(result));
            core.setOutput('base', result.base);
      - name: Check whitespace
        env:
          BASE_SHA: ${{ steps.boundary.outputs.base }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Validate all 14 canonical tables
        run: npm run canonical:validate
      - name: Validate ID ledger and all changes since base
        env:
          BASE_SHA: ${{ steps.boundary.outputs.base }}
        run: npm run ids:validate -- --base "$BASE_SHA"
      - name: Run tests
        run: npm test
      - name: Validate rankings
        run: npm run rankings:validate
      - name: Validate song catalog and public JSON contract
        run: npm run songs:validate
      - name: Build static site from canonical CSV
        run: npm run site:build
      - name: Check generated ranking and song data is committed
        run: npm run site:check-generated
      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      # Hold the deployment concurrency lock while checking freshness and deploying.
      # Never cancel an active deployment: cancellation can leave server-side work running.
      - name: Check verified SHA is still latest main
        id: freshness
        uses: actions/github-script@v8
        env:
          VERIFIED_SHA: ${{ needs.build.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            const current = data.object.sha === process.env.VERIFIED_SHA;
            core.setOutput('current', String(current));
            if (!current) core.notice('Newer main exists; skip publishing this older artifact.');
      - name: Deploy GitHub Pages artifact
        if: steps.freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
